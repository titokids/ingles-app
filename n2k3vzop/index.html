<!doctype html>
<html lang="es">
<head>
<base href="../">
<link rel="manifest" href="n2k3vzop/manifest.webmanifest">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3BAA6B">
<link rel="icon" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<title>Inglés con Tito</title>
<link rel="stylesheet" href="fonts/fontes.css">
<style>
:root{--bg:#FFF8EC;--card:#FFFFFF;--green:#3BAA6B;--green-d:#2C8A54;--orange:#FF9F43;--yellow:#FFD166;--blue:#5DADE2;--pink:#FF8FAB;--ink:#3D3355;--ink-2:#7A7091;--line:#EFE3CC;--shadow:0 6px 0 rgba(61,51,85,.10),0 10px 24px rgba(61,51,85,.10);--r:26px;--letter:"Andika",sans-serif;--ui:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
button{font-family:var(--ui);border:0;cursor:pointer;color:inherit;background:none}
.proto{position:fixed;top:0;left:0;right:0;z-index:99;background:#3D3355;color:#FFD166;font:800 11px/1 var(--ui);letter-spacing:.08em;text-align:center;padding:5px 8px;text-transform:uppercase}
.screen{position:fixed;inset:0;padding-top:env(safe-area-inset-top);display:none;flex-direction:column}
.screen.on{display:flex}
/* fundo da atividade: um por mundo; o que fica solto sobre o desenho ganha cartão branco */
#lesson{background:var(--bg) center bottom/cover no-repeat}
#lesson .word,#lesson .slots{background:rgba(255,255,255,.94);border-radius:var(--r);box-shadow:var(--shadow)}
#lesson .slots{padding:10px 12px}
#lesson .reveal,#lesson .spic{background:#fff;border-radius:var(--r);padding:12px 22px;box-shadow:var(--shadow)}
#lesson .gloss{background:#fff;border-radius:18px;padding:8px 18px;box-shadow:var(--shadow)}
#lesson .reveal .gloss{box-shadow:none;padding:0}
#lesson .big,#lesson .end-sub{background:#fff;border-radius:99px;padding:12px 24px;box-shadow:var(--shadow)}
#lesson .prog{background:rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(61,51,85,.2)}
/* topo */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{font:900 19px/1 var(--ui);display:flex;align-items:center;gap:8px;flex:1;white-space:nowrap}
.brand span{color:var(--green)}
.pill{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:10px 14px;font:800 15px/1 var(--ui);display:flex;gap:6px;align-items:center}
/* trilha */
.trail{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.trail-in{position:relative;margin:0 auto;max-width:460px}
.map{position:relative;width:100%;background:url(img/mapa.jpg) 0 0/100% 100% no-repeat}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stop{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;z-index:1;border-radius:50%;background:center/contain no-repeat;display:flex;align-items:center;justify-content:center;font:900 27px/1 var(--ui);color:var(--ink);text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;filter:drop-shadow(0 5px 4px rgba(61,51,85,.35))}
.stop.lock{filter:grayscale(.8) brightness(1.08) drop-shadow(0 4px 3px rgba(61,51,85,.25));opacity:.9}
.stop.now{width:86px;height:86px;margin:-43px 0 0 -43px;z-index:3;animation:pulse 1.6s infinite}
.stop.now::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 5px rgba(59,170,107,.55)}
.stop .badge{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px}
.stop .mid{width:40px;height:40px}
.stop small{position:absolute;bottom:-24px;background:#fff;border-radius:99px;padding:3px 9px;font:800 12px/1 var(--ui);color:var(--ink-2);text-shadow:none;box-shadow:0 2px 6px rgba(61,51,85,.2)}
.tito-here{position:absolute;z-index:4;width:62px;margin:-96px 0 0 -31px;animation:bob 1.8s ease-in-out infinite;pointer-events:none}
.tito-here .pic-img{width:62px;height:62px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* lição */
.lbar{display:flex;align-items:center;gap:12px;padding:12px 16px}
.x{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font:900 20px/1 var(--ui)}
.prog{flex:1;height:16px;background:#EADFC9;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:10px 16px 28px;position:relative}
.guide{font-size:54px;line-height:1}
.speak{width:92px;height:92px;border-radius:50%;background:var(--card);box-shadow:var(--shadow)}
.speak:active,.opt:active,.next:active,.lcard:active{transform:translateY(4px);box-shadow:none}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.opt{width:104px;height:116px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);font:700 68px/1 var(--letter);color:var(--ink)}
.opt.pic{font-size:62px}
.opt.ok{background:var(--green);color:#fff;box-shadow:0 6px 0 var(--green-d)}
.wob{animation:wob .45s}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px) rotate(-3deg)}75%{transform:translateX(9px) rotate(3deg)}}
.lcard{width:140px;height:196px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lcard b{font:700 76px/1 var(--letter)}
.lcard em{font-style:normal;font-size:40px;opacity:0;transform:scale(.4);transition:.3s}
.lcard.seen em{opacity:1;transform:scale(1)}
.lcard.seen{background:#EAF7EF}
.next{position:absolute;right:18px;bottom:22px;width:78px;height:78px;border-radius:50%;background:var(--green);color:#fff;font:900 36px/1 var(--ui);box-shadow:0 6px 0 var(--green-d);display:none}
.next.on{display:block;animation:pulse 1.4s infinite}
/* deslizar e juntar */
.blend{width:min(88vw,460px);display:flex;flex-direction:column;align-items:center;gap:26px}
.word{position:relative;width:100%;height:120px}
.word .lt{position:absolute;top:0;font:700 96px/120px var(--letter);color:#C9BFAE;transform:translateX(-50%);transition:color .2s, transform .6s cubic-bezier(.3,1.4,.5,1)}
.word .lt.lit{color:var(--orange);transform:translateX(-50%) scale(1.18)}
.word.merged .lt{color:var(--ink)}
.track{position:relative;width:100%;height:64px;background:var(--card);border-radius:99px;box-shadow:inset 0 3px 0 rgba(61,51,85,.08),var(--shadow);touch-action:none}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#FFE3BF;border-radius:99px}
.knob{position:absolute;top:50%;left:32px;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--orange);box-shadow:0 5px 0 #D9802C;display:flex;align-items:center;justify-content:center;font-size:28px}
.hint .knob{animation:hint 2.2s ease-in-out infinite}
@keyframes hint{0%,15%{left:32px}70%,100%{left:calc(100% - 32px)}}
.reveal{font-size:110px;line-height:1;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:6px;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.reveal.on{transform:scale(1)}
.sit{animation:sit 1s ease-in-out 2}
@keyframes sit{50%{transform:scale(1.1,.82) translateY(14px)}}
.again{font:800 15px/1 var(--ui);color:var(--ink-2);background:var(--card);border-radius:99px;padding:10px 16px;box-shadow:var(--shadow);visibility:hidden}
.readword{font:700 104px/1 var(--letter);background:var(--card);border-radius:var(--r);padding:18px 34px 26px;box-shadow:var(--shadow)}
/* fim */
.big{font:900 30px/1.1 var(--ui);text-align:center;margin:0}
.sticker{font-size:120px;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.cta{background:var(--green);color:#fff;font:900 22px/1 var(--ui);border-radius:99px;padding:18px 34px;box-shadow:0 6px 0 var(--green-d)}
/* confete */
.conf{position:fixed;pointer-events:none;font-size:30px;z-index:50;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
/* modais */
.modal{position:fixed;inset:0;background:rgba(61,51,85,.45);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px 34px}
.sheet h2{font:900 24px/1.15 var(--ui);margin:0 0 6px}
.sheet h3{font:900 15px/1 var(--ui);color:var(--green-d);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px}
.sheet p{margin:0 0 8px;font:600 16px/1.45 var(--ui);color:var(--ink)}
.sheet .muted{color:var(--ink-2);font-size:14px}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.slot{aspect-ratio:1;border-radius:18px;background:#EDE4D3;display:flex;align-items:center;justify-content:center;font-size:30px;color:#C2B69F;font-weight:900}
.slot.got{background:var(--card);box-shadow:var(--shadow)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.words b{font:700 26px/1 var(--letter);background:var(--card);border-radius:14px;padding:8px 14px 12px;box-shadow:var(--shadow)}
.hold{margin-top:16px;width:100%;height:64px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;font:800 16px/1 var(--ui)}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--yellow);transition:width linear}
.hold span{position:relative}
.close{float:right;width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font:900 18px/1 var(--ui)}
.pic-img{display:block;object-fit:contain;max-width:100%}
.lcard em .pic-img{width:52px;height:52px}
.opt.pic .pic-img{width:84px;height:84px;margin:auto}
.reveal .pic-img{width:130px;height:130px;margin:auto}
.sticker .pic-img{width:150px;height:150px}
.slot .pic-img{width:80%;height:80%}
.stop .pic-img{width:50px;height:50px}
.guide .pic-img{width:96px;height:96px}
.tito-here .pic-img{width:64px;height:64px}
.brand img{width:34px;height:34px;border-radius:9px}
.ui-ic{width:28px;height:28px;object-fit:contain}
.speak .pic-img{width:58px;height:58px;margin:auto}
.knob .pic-img{width:36px;height:36px}
.again{display:inline-flex;align-items:center;gap:6px}
.again .pic-img{width:22px;height:22px}
.conf .pic-img{width:30px;height:30px}
.stop:not(.done) .pic-img{width:36px;height:36px;opacity:.85}
.hand2{position:absolute;left:56%;top:50%;width:50px;height:50px;pointer-events:none;z-index:6;animation:tapme 1.4s ease-in-out infinite;filter:drop-shadow(0 3px 5px rgba(61,51,85,.35))}
@keyframes tapme{0%,100%{transform:translate(0,0)}35%{transform:translate(-5px,-9px)}55%{transform:translate(-2px,-3px) scale(.9)}}
.lcard,.cta{position:relative}
.invite > *{animation:invite 2.4s ease-in-out infinite}
.invite > *:nth-child(2){animation-delay:.2s}.invite > *:nth-child(3){animation-delay:.4s}
@keyframes invite{0%,62%,100%{transform:translateY(0)}72%{transform:translateY(-14px)}82%{transform:translateY(0)}}
.ghost{position:absolute;top:56%;left:32px;width:54px;height:54px;margin-left:-20px;display:none;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(61,51,85,.3))}
.hint .ghost{display:block;animation:hint 2.2s ease-in-out infinite}
.chev{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px;font:900 36px/1 var(--ui);color:#F0B877;pointer-events:none}
.chev i{font-style:normal;animation:chev 1.2s infinite}
.chev i:nth-child(2){animation-delay:.2s}.chev i:nth-child(3){animation-delay:.4s}
@keyframes chev{0%,100%{opacity:.2}50%{opacity:1}}
.track.done .chev{display:none}
.lcard em{display:flex;flex-direction:column;align-items:center;gap:2px}
.w-en{font:700 23px/1.1 var(--letter);color:var(--ink)}
.w-es{font:700 13px/1 var(--ui);color:var(--ink-2)}
.gloss{font:800 17px/1.25 var(--ui);color:var(--ink-2);text-align:center}
.gloss b{font:700 28px/1 var(--letter);color:var(--ink)}
.build{width:min(90vw,460px);display:flex;flex-direction:column;align-items:center;gap:18px}
.bpic{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px}
.bpic .pic-img{width:130px;height:130px}
.slots{display:flex;gap:10px;justify-content:center;transition:gap .5s}
.slot2{width:74px;height:86px;border-radius:18px;border:4px dashed #D9CCB4;display:flex;align-items:center;justify-content:center;transition:all .4s}
.slot2.cheio{border:4px solid transparent;background:var(--card);box-shadow:var(--shadow)}
.slots.junto{gap:0}.slots.junto .slot2{background:transparent;box-shadow:none;width:auto;min-width:44px}
.posto{font:700 60px/1 var(--letter);color:var(--ink);animation:pop .4s}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tile{width:74px;height:82px;border-radius:18px;background:var(--yellow);box-shadow:0 6px 0 #E0B13F;font:700 54px/1 var(--letter);color:var(--ink);touch-action:none;position:relative}
.tile.usado{visibility:hidden}
.pagina{font:800 14px/1 var(--ui);color:var(--ink-2);background:var(--card);border-radius:99px;padding:6px 12px;box-shadow:var(--shadow)}
.spic .pic-img{width:190px;height:190px}
.sline{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:92vw}
.sw{font:700 42px/1.2 var(--letter);color:var(--ink);background:var(--card);border-radius:14px;padding:4px 12px 10px;box-shadow:var(--shadow);transition:all .2s}
.sw.lida{color:var(--green-d)}.sw.on{background:var(--orange);color:#fff;transform:scale(1.12)}
#pasosInstalar ol{margin:12px 0 0;padding-left:22px;font:600 15.5px/1.5 var(--ui)}
#pasosInstalar li{margin:6px 0}
/* menu do jogo */
#menu{background:#7EC8F0 url(img/fundo-menu.webp) center bottom/cover no-repeat;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow-y:auto;gap:10px}
.mlogo{display:flex;flex-direction:column;align-items:center;transform:rotate(-3deg);animation:logo .8s cubic-bezier(.3,1.6,.5,1)}
.mlogo span{font:900 clamp(42px,13vw,58px)/.95 var(--ui);color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink),0 12px 18px rgba(61,51,85,.35)}
.mlogo span+span{color:var(--yellow);font-size:clamp(34px,10.5vw,46px)}
@keyframes logo{0%{transform:rotate(-3deg) scale(.3);opacity:0}100%{transform:rotate(-3deg) scale(1);opacity:1}}
.mtito{width:clamp(130px,40vw,180px);height:clamp(130px,40vw,180px);flex-shrink:0;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(61,51,85,.3))}
.mtito img{width:100%;height:100%;object-fit:contain}
.mtito.pula{animation:pula .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pula{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-34px) scale(1.06,.94)}100%{transform:translateY(0) scale(1)}}
.jugar{position:relative;display:flex;align-items:center;gap:14px;flex-shrink:0;background:var(--green);color:#fff;font:900 30px/1 var(--ui);padding:20px 40px 22px 32px;border-radius:99px;border:4px solid #fff;box-shadow:0 8px 0 var(--green-d),0 14px 24px rgba(61,51,85,.3);animation:pulse 1.6s infinite}
.jugar i{width:0;height:0;border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent}
.mniveis{display:flex;gap:12px;width:100%;max-width:440px;flex-shrink:0}
.ncard{flex:1;position:relative;background:#fff;border:4px solid #fff;border-radius:22px;padding:6px 6px 12px;box-shadow:0 6px 0 rgba(61,51,85,.18),0 10px 20px rgba(61,51,85,.18);display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.ncard.atual{border-color:var(--yellow)}
.nthumb{position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:3/2;border-radius:15px;background:center/cover no-repeat}
.ncard b{font:900 18px/1.1 var(--ui);margin:5px 4px 0}
.ncard small{font:800 12.5px/1.25 var(--ui);color:var(--ink-2);margin:0 4px}
.nprog{display:block;width:calc(100% - 8px);margin:5px 4px 0;height:10px;background:#EADFC9;border-radius:99px;overflow:hidden}.nprog i{display:block;height:100%;background:var(--green);border-radius:99px}
.nstar{display:flex;align-items:center;gap:4px;font:900 13px/1 var(--ui);margin:6px 4px 0}.nstar img{width:18px;height:18px}
.ncard.lock .nthumb{filter:grayscale(.5) brightness(.92)}
.ncard.lock .nthumb img{width:48px;height:48px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.ncard.lock .nthumb em{position:absolute;top:-10px;right:-8px;background:var(--orange);color:#fff;font:900 12px/1 var(--ui);font-style:normal;padding:6px 9px;border-radius:99px;transform:rotate(8deg);box-shadow:0 3px 0 #D9802C}
.ncard.lock{animation:invite 2.6s ease-in-out infinite}
.mbar{display:flex;gap:14px;flex-shrink:0}
.mbtn{display:flex;align-items:center;gap:8px;background:#fff;border-radius:99px;padding:9px 18px 9px 10px;font:900 16px/1 var(--ui);box-shadow:0 5px 0 rgba(61,51,85,.18)}
.mbtn img{width:34px;height:34px}
.volta{font:900 26px/1 var(--ui);margin:-3px 2px 0 -2px}
.alb-n{font:900 14px/1 var(--ui);color:var(--green-d);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 0}
/* oferta do Nível 2 na área dos pais (só em /n1/) */
.oferta{margin:18px 0 6px;border-radius:22px;overflow:hidden;background:#2E2560;box-shadow:var(--shadow)}
.oferta>img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover}
.of-in{padding:14px 16px 18px}
.sheet .oferta h3.of-t{color:var(--yellow);text-transform:none;letter-spacing:0;font:900 21px/1.2 var(--ui);margin:0 0 8px}
.sheet .oferta p{color:#fff;font:600 15.5px/1.45 var(--ui)}
.of-fig{display:flex;gap:6px;margin:10px 0}.of-fig .pic-img{width:50px;height:50px;background:#fff;border-radius:12px;padding:4px}
.sheet .oferta .of-preco{font:900 17px/1.2 var(--ui);color:var(--yellow);margin:8px 0 12px}
.of-cta{background:var(--orange);box-shadow:0 6px 0 #D9802C;width:100%;font-size:19px;padding:17px 14px}
.lee-n b{font:900 30px/1 var(--ui);color:var(--green-d)}
details.todas{margin-top:10px}details.todas summary{font:800 15px/1 var(--ui);color:var(--green-d);cursor:pointer;padding:6px 0}
.n2img{width:100%;border-radius:18px;margin:8px 0 12px}
.word .lt.muda.lit{color:#9B7FD9}
.word .lt.magia{color:#9B7FD9!important;text-shadow:0 0 18px #CDBBFF}
.tile{min-width:74px;width:auto;padding:0 10px}
.slot2{min-width:74px;width:auto;padding:0 6px}
.slots.n5 .slot2{min-width:54px;height:70px}.slots.n5 .posto{font-size:44px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;font:800 15px/1.3 var(--ui);padding:12px 18px;border-radius:16px;z-index:70;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>

<!-- MENU DO JOGO -->
<section class="screen on" id="menu">
  <div class="mlogo"><span>Inglés</span><span>con Tito</span></div>
  <button class="mtito" id="mTito" aria-label="Tito"><img src="img/tito-ola.webp" alt=""></button>
  <button class="jugar" id="bJugar"><i></i>¡A jugar!</button>
  <div class="mniveis" id="mNiveis"></div>
  <div class="mbar"><button class="mbtn" id="bAlbumMenu"><img src="img/ui-album.webp" alt=""><span>Mi álbum</span></button><button class="mbtn" id="mPapas2"><img src="img/ui-familia.webp" alt=""><span>Papás</span></button></div>
</section>

<!-- TRILHA -->
<section class="screen" id="home">

let NV = 1, LS, MAPA, MUNDOS, FICHAS;

  LS = c.lessons; MAPA = c.mapa; MUNDOS = c.mundos; FICHAS = MUNDOS.map(m => "parada-" + m); S = store.get();

}
(() => {
  let n = 0; try { n = +localStorage.getItem("tito-nivel") || 0; } catch(e){}
  if (!n) n = NIVEIS[2] && store.get(NIVEIS[1].chave).done.includes(TOTAL) ? 2 : 1;
  setNivel(n);
})();
function renderTrail(){
  const box = $("trailIn"); box.innerHTML = "";
  const [mw, mh] = MAPA.aspecto, VH = 1000 * mh / mw;
  const map = document.createElement("div"); map.className = "map"; map.style.aspectRatio = mw + " / " + mh; map.style.backgroundImage = `url(img/${NIVEIS[NV].img})`;
  const cur = S.done.length >= TOTAL ? TOTAL : Math.min(TOTAL, Math.max(1, ...S.done.map(n => n + 1), 1));
  const curY = MAPA.paradas[cur - 1][1];
  const pts = MAPA.caminho.map(([x, y]) => (x * 1000).toFixed(1) + "," + (y * VH).toFixed(1)).join(" ");
  const feito = MAPA.caminho.filter(([x, y]) => y >= curY).map(([x, y]) => (x * 1000).toFixed(1) + "," + (y * VH).toFixed(1)).join(" ");
  map.innerHTML = `<svg viewBox="0 0 1000 ${VH.toFixed(0)}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="rgba(61,51,85,.22)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${pts}" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-dasharray="0 50"/>
      <polyline points="${feito}" fill="none" stroke="#C9661F" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${feito}" fill="none" stroke="#FFB547" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  for (let i = 1; i <= TOTAL; i++){
    const [x, y] = MAPA.paradas[i - 1];
    const done = S.done.includes(i), now = i === cur && !done, story = LS[i].tipo === "historia", grad = LS[i].tipo === "formatura";
    const b = document.createElement("button");
    b.className = "stop" + (done ? " done" : now ? " now" : " lock");
    b.style.left = (x * 100) + "%"; b.style.top = (y * 100) + "%";
    b.style.backgroundImage = `url(img/${FICHAS[Math.floor((i - 1) / 6)]}.webp)`;
    const centro = grad ? `<img class="pic-img mid" src="img/tito-formatura.webp" alt="">` : story ? `<img class="pic-img mid" src="img/ui-livro.webp" alt="">` : i;
    const badge = done ? `<img class="badge" src="img/ui-estrela.webp" alt="">` : (!now ? `<img class="badge" src="img/ui-cadeado.webp" alt="">` : "");

    b.onclick = () => now || done ? openLesson(i) : toast("Primero termina la lección anterior");
    map.appendChild(b);
    if (now){ const t = document.createElement("div"); t.className = "tito-here"; t.innerHTML = pic("tito-ola.png"); t.style.left = (x * 100 + (x > .5 ? -17 : 17)) + "%"; t.style.top = (y * 100) + "%"; map.appendChild(t); }
  }

    const r = c.getBoundingClientRect(), tr = t.getBoundingClientRect();
    t.scrollTop += (r.top + r.height / 2) - (tr.top + tr.height * 0.62);
  }, 60);
  setHint(() => pointAt(document.querySelector(".stop.now")), 1500);
}

/* ===== lição ===== */
let steps = [], si = 0, L = null, LN = 1;
function openLesson(n){
  L = LS[n]; LN = n; si = 0; steps = [];
  $("lesson").style.backgroundImage = `url(img/fundo-${MUNDOS[Math.floor((n - 1) / 6)]}.webp)`;
  if (["licao", "revisao", "juntas"].includes(L.tipo)){
    if (L.tipo === "licao") steps.push({t:"meet"});
    L.listen.forEach(l => steps.push({t:"listen", l}));
    L.blend.forEach(b => steps.push({t:"blend", b}));
    L.build.forEach(b => steps.push({t:"build", b}));
    L.which.forEach(w => steps.push({t:"which", w}));
  } else L.paginas.forEach((pg, i) => steps.push({t:"story", pg, i}));
  steps.push({t:"end"});
  show("lesson"); runStep();
}
function progress(){ $("progI").style.width = (si / (steps.length - 1) * 100) + "%"; }
function nextBtn(on){ $("bNext").classList.toggle("on", !!on); }
$("bNext").onclick = () => { stopHint(); nextBtn(false); si++; runStep(); };
$("bExit").onclick = () => { speechSynthesis && speechSynthesis.cancel(); show("home"); renderTrail(); };

function runStep(){
  progress(); nextBtn(false);
  const st = steps[si], stage = $("stage"); stage.innerHTML = "";
  ({meet, listen, blend, build, which, story, end})[st.t](stage, st);
}
/* como o som aparece sozinho (cartão e opção): a e mágica vira a_e */
const mostra = g => /^[aiou]-e$/.test(g) ? g[0] + "_e" : g === "oo2" ? "oo" : g;

/* 1. conhecer os sons novos */
function meet(stage){
  stage.innerHTML = `<div class="guide">${pic("tito-aponta")}</div><div class="row" id="cards"></div>`;
  const seen = new Set();
  L.novos.forEach(g => {
    const [fig, kw, es] = L.key[g], c = document.createElement("button"); c.className = "lcard";
    c.innerHTML = `<b>${mostra(g)}</b><em>${pic(fig)}<span class="w-en">${kw}</span><span class="w-es">${es}</span></em>`;
    c.onclick = async () => { c.classList.add("seen"); await sound(g); await sleep(150); await word(kw); seen.add(g); if (seen.size === L.novos.length){ nextBtn(true); hintNext(); } };
    $("cards").appendChild(c);
  });
  setHint(() => pointAt(document.querySelector(".lcard:not(.seen)")), 1200);
}

/* 2. ouvir e tocar (nunca oferece duas letras com o mesmo som) */
function listen(stage, st){
  const igual = (x, y) => mesmoSom(x, y) || mostra(x) === mostra(y);
  const outros = L.opcoes_som.filter(x => x !== "e!" && !igual(x, st.l)).sort(() => Math.random() - .5).filter((x, i, a) => a.findIndex(y => igual(x, y)) === i).slice(0, 2);
  const opts = [st.l, ...outros].sort(() => Math.random() - .5);
  stage.innerHTML = `<button class="speak" id="sp">${pic("ui-som")}</button><div class="row" id="opts"></div>`;
  $("sp").onclick = () => sound(st.l);
  let locked = false;
  opts.forEach(l => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = mostra(l); if (mostra(l).length > 2) b.style.fontSize = "48px";
    b.onclick = async () => {
      if (locked) return;
      if (l === st.l){ locked = true; stopHint(); b.classList.add("ok"); yay(); confetti(b); await sound(l); await sleep(500); si++; runStep(); }
      else { b.classList.remove("wob"); void b.offsetWidth; b.classList.add("wob"); soft(); await sleep(450); sound(st.l); }
    };
    $("opts").appendChild(b);
  });
  setTimeout(() => sound(st.l), 350);
  setHint(() => invite($("opts")), 2600);
}

/* 3. deslizar e juntar: o momento uau */
function blend(stage, st){
  const w = st.b.w, gs = st.b.g, letters = gs.map(letra);
  stage.innerHTML = `<div class="blend hint" id="bl">
      <div class="word" id="wd">${gs.map(g => `<span class="lt${g === "e!" ? " muda" : ""}">${letra(g)}</span>`).join("")}</div>
      <div class="track" id="tr"><div class="fill" id="fl"></div><div class="chev"><i>›</i><i>›</i><i>›</i></div><div class="knob" id="kn">${pic("ui-dedo")}</div><img class="ghost" src="img/ui-dedo.webp" alt=""></div>
      <div class="reveal" id="rv">${pic(st.b.pic)}<div class="gloss"><b>${w}</b><br>${st.b.es || ""}</div></div>
      <button class="again" id="ag">${pic("ui-repetir")} Otra vez</button>
    </div>`;
  const wd = $("wd"), tr = $("tr"), kn = $("kn"), fl = $("fl"), rv = $("rv"), ag = $("ag"), spans = [...wd.children];
  let W, centers, lit, merged, dragging;
  function layout(){
    W = tr.clientWidth;
    const n = letters.length, chars = letters.reduce((a, l) => a + l.length, 0);
    const fs = Math.min(96, Math.floor((W - 70) / (chars * 0.6 + (n - 1) * 0.5)));
    spans.forEach(s => { s.style.fontSize = fs + "px"; s.style.transform = ""; });
    const larg = spans.map(s => s.offsetWidth), soma = larg.reduce((a, b) => a + b, 0);
    const gap = n > 1 ? Math.min(fs * 1.3, Math.max(fs * 0.35, (W - 100 - soma) / (n - 1))) : 0;
    let x = (W - soma - gap * (n - 1)) / 2;
    centers = larg.map(l => { const c = x + l / 2; x += l + gap; return c; });
    spans.forEach((s, i) => s.style.left = centers[i] + "px");
  }
  function reset(){ lit = new Array(letters.length).fill(false); merged = false; spans.forEach(s => s.classList.remove("lit", "magia")); wd.classList.remove("merged"); rv.classList.remove("on"); rv.classList.remove("sit"); kn.style.left = "32px"; fl.style.width = "0"; ag.style.visibility = "hidden"; tr.classList.remove("done"); layout(); }
  reset();
  const reHint = () => setHint(() => { const b = $("bl"); if (b && !merged && !dragging) b.classList.add("hint"); }, 60000);
  reHint();
  function at(clientX){
    const r = tr.getBoundingClientRect(); const x = Math.max(32, Math.min(W - 32, clientX - r.left));
    kn.style.left = x + "px"; fl.style.width = x + "px";
    for (let i = 0; i < letters.length; i++){
      if (!lit[i] && x >= centers[i] - 14 && (i === 0 || lit[i - 1])){
        lit[i] = true; spans[i].classList.add("lit"); sound(gs[i]);
        if (gs[i] === "e!") gs.forEach((g, j) => { if (/^[aiou]-e$/.test(g)) spans[j].classList.add("magia"); });
      }
    }
    if (!merged && x >= W - 40 && lit.every(Boolean)) merge();
  }
  async function merge(){
    merged = true; dragging = false; tr.classList.add("done"); await sleep(450);
    const larg = spans.map(s => s.offsetWidth), total = larg.reduce((a, b) => a + b, 0);
    let x0 = W / 2 - total / 2;
    spans.forEach((s, i) => { s.classList.remove("lit", "magia"); const c = x0 + larg[i] / 2; x0 += larg[i]; s.style.transform = `translateX(calc(-50% + ${c - centers[i]}px))`; });
    wd.classList.add("merged"); await sleep(650);
    rv.classList.add("on"); if (w === "sat" || w === "sit") rv.classList.add("sit");

  tr.addEventListener("pointerup", () => dragging = false);

  ag.onclick = () => { nextBtn(false); reset(); $("bl").classList.add("hint"); reHint(); };

}

/* 4. montar a palavra: tocar ou arrastar as letras para as casinhas */
function build(stage, st){
  const g = st.b.g, w = st.b.w;
  const extra = L.opcoes_som.filter(x => x !== "-s" && x !== "e!" && !g.some(y => mesmoSom(x, y) || letra(x) === letra(y))).sort(() => Math.random() - .5)

      t.classList.add("usado"); const c = document.createElement("span"); c.className = "posto"; c.textContent = letra(t.dataset.g); slots[pos].appendChild(c); slots[pos].classList.add("cheio");
      pos++; sound(t.dataset.g);
      if (pos === g.length){ pronto = true; stopHint(); await sleep(500); $("sl").classList.add("junto"); $("gl").style.visibility = "visible"; yay(); confetti($("sl")); await word(w); nextBtn(true); hintNext(); }
    } else { t.classList.remove("wob"); void t.offsetWidth; t.classList.add("wob"); soft(); await sleep(400); sound(g[pos]); }
  }
  pecas.forEach(x => {
    const t = document.createElement("button"); t.className = "tile"; t.textContent = letra(x); t.dataset.g = x;
    let ini = null, arr = false;
    t.addEventListener("pointerdown", e => { e.preventDefault(); if (t.classList.contains("usado")) return; ini = [e.clientX, e.clientY]; arr = false; t.setPointerCapture(e.pointerId); });
    t.addEventListener("pointermove", e => { if (!ini) return; const dx = e.clientX - ini[0], dy = e.clientY - ini[1]; if (arr || Math.hypot(dx, dy) > 10){ arr = true; t.style.transform = `translate(${dx}px,${dy}px) scale(1.1)`; t.style.zIndex = 5; } });
    t.addEventListener("pointerup", e => {
      if (!ini) return; const foi = arr; ini = null; t.style.transform = ""; t.style.zIndex = "";
      if (!foi){ tentar(t); return; }
      const r = $("sl").getBoundingClientRect();
      if (e.clientX > r.left - 30 && e.clientX < r.right + 30 && e.clientY > r.top - 40 && e.clientY < r.bottom + 40) tentar(t);
    });
    $("ti").appendChild(t);
  });
  setTimeout(() => word(w), 400);
  setHint(() => invite($("ti")), 3000);
}

/* 5. qual é? */
function which(stage, st){
  const w = st.w.w, right = st.w.pic, g = st.w.g || (L.blend.find(b => b.w === w) || {g: [...w]}).g;
  stage.innerHTML = `<button class="readword" id="rw"${w.length > 4 ? ' style="font-size:76px"' : ""}>${w}</button><div class="gloss" id="gl" style="visibility:hidden">${st.w.es || ""}</div><div class="row" id="opts"></div>`;
  $("rw").onclick = async () => { for (const l of g) { await sound(l); await sleep(120); } };
  let locked = false;
  st.w.opts.slice().sort(() => Math.random() - .5).forEach(p => {
    const b = document.createElement("button"); b.className = "opt pic"; b.innerHTML = pic(p);
    b.onclick = async () => {
      if (locked) return;
      if (p === right){ locked = true; stopHint(); b.classList.add("ok"); $("gl").style.visibility = "visible"; yay(); confetti(b); await word(w); await sleep(1100); si++; runStep(); }
      else { b.classList.remove("wob"); void b.offsetWidth; b.classList.add("wob"); soft(); }
    };
    $("opts").appendChild(b);
  });
  setHint(() => invite($("opts")), 2600);
}

/* 6. hora da história: cada palavra acende enquanto o Tito lê */
function story(stage, st){
  const pal = st.pg.t.split(" ");
  stage.innerHTML = `<div class="pagina">${st.i + 1} / ${L.paginas.length}</div><div class="spic">${pic(st.pg.pic)}</div>
    <div class="sline" id="sline">${pal.map((p, i) => `<button class="sw" data-i="${i}">${p}</button>`).join(" ")}</div>
    <button class="speak" id="sp">${pic("ui-som")}</button>`;
  const spans = [...$("sline").children]; let lendo = false;
  spans.forEach(b => b.onclick = () => word(limpa(b.textContent)));
  async function ler(){
    if (lendo) return; lendo = true; stopHint();
    for (const b of spans){ spans.forEach(x => x.classList.remove("on")); b.classList.add("on", "lida"); await word(limpa(b.textContent)); await sleep(120); }
    spans.forEach(x => x.classList.remove("on")); lendo = false; nextBtn(true); hintNext();
  }
  $("sp").onclick = ler; setTimeout(ler, 600);
}

/* 7. fim: adesivo (e certificado na formatura) */
function end(stage){
  if (!S.done.includes(LN)){ S.done.push(LN); store.set(S); }
  const grad = L.tipo === "formatura";
  stage.innerHTML = `<p class="big">${grad ? "¡Felicidades!" : "¡Muy bien!"}</p><div class="sticker" id="stk">${pic(L.sticker)}</div>
    <p class="end-sub" style="font:800 16px var(--ui);color:var(--ink-2)">${grad ? "Terminaste el Nivel " + NV : "Nuevo adhesivo en tu álbum"}</p>
    ${grad && NV === 1 && !NIVEIS[2] ? `<p class="end-sub" style="font:800 15px/1.35 var(--ui);color:var(--ink);border-radius:18px;max-width:320px;text-align:center">${TXT.formatura}</p>` : ""}
    ${grad ? `<button class="cta" id="bCert" style="background:var(--orange);box-shadow:0 6px 0 #D9802C">Certificado</button>` : ""}<button class="cta" id="bHome">➜</button>`;
  yay(); setTimeout(() => confetti($("stk")), 200);
  $("bHome").onclick = () => {
    if (grad && NIVEIS[NV + 1]) setNivel(NV + 1);
    else if (grad && NV === 1){ show("menu"); renderMenu(); return; }
    show("home"); renderTrail();
  };
  if (grad) $("bCert").onclick = certificado;
  $("progI").style.width = "100%";
  setHint(() => pointAt($("bHome")), 1800);
}

/* certificado para imprimir */
function certificado(){
  const nome = (prompt("Nombre del niño o de la niña:") || "").trim();
  const data = new Date().toLocaleDateString("es-MX", {day: "numeric", month: "long", year: "numeric"});
  const base = location.href.replace(/[^/]*$/, "");
  const win = window.open("", "_blank");
  if (!win){ toast("Permita ventanas emergentes para imprimir"); return; }
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Certificado</title><link rel="stylesheet" href="fonts/fontes.css">
  <style>@page{size:landscape;margin:12mm}body{margin:0;font-family:Nunito,sans-serif;color:#3D3355;display:flex;align-items:center;justify-content:center;min-height:95vh}
  .c{border:10px solid #3BAA6B;border-radius:28px;padding:36px 54px;text-align:center;max-width:900px;background:#FFF8EC}
  h1{font:900 46px/1.1 Nunito;margin:10px 0;color:#2C8A54}.n{font:700 56px/1.2 Andika;margin:14px 0;border-bottom:3px dashed #FF9F43;display:inline-block;min-width:60%}
  p{font-size:22px;margin:8px 0}img{width:150px}.f{display:flex;justify-content:space-between;margin-top:22px;font-size:16px;color:#7A7091}</style></head>
  <body><div class="c"><img src="${base}img/tito-formatura.webp" alt=""><h1>Certificate of Reading</h1><p>Certificado de lectura · Nivel ${NV}</p>
  <div class="n">${nome || "&nbsp;"}</div><p><b>I can read in English!</b> · ¡Ya leo en inglés!</p>
  <div class="f"><span>Inglés con Tito</span><span>${data}</span></div></div><script>setTimeout(()=>print(),600)<\/script></body></html>`);
  win.document.close();
}

/* ===== álbum ===== */
$("bAlbum").onclick = () => {
  const varios = Object.keys(NIVEIS).length > 1;
  $("albumGrid").innerHTML = Object.keys(NIVEIS).map(k => { const d = (+k === NV ? S : store.get(NIVEIS[k].chave)).done;
    return (varios ? `<p class="alb-n">Nivel ${k} · ${d.length}/${TOTAL}</p>` : "") + `<div class="album">` +
      Array.from({length: TOTAL}, (_, i) => { const n = i + 1, got = d.includes(n); return `<div class="slot ${got ? "got" : ""}">${got ? pic(NIVEIS[k].lessons[n].sticker) : n}</div>`; }).join("") + `</div>`; }).join("");
  $("mAlbum").classList.add("on");
};

/* ===== portão e área dos pais ===== */
$("bPapas").onclick = () => $("mGate").classList.add("on");
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest(".modal").classList.remove("on"));
(() => {
  const h = $("bHold"), bar = h.querySelector("i"); let t;
  const start = e => { e.preventDefault(); bar.style.transition = "width 3s linear"; bar.style.width = "100%"; t = setTimeout(() => { $("mGate").classList.remove("on"); openPapas(); stop(); }, 3000); };
  const stop = () => { clearTimeout(t); bar.style.transition = "width .2s"; bar.style.width = "0"; };
  h.addEventListener("pointerdown", start); ["pointerup", "pointerleave", "pointercancel"].forEach(ev => h.addEventListener(ev, stop));
})();
let irOferta = false;
function openPapas(){
  const lidas = [...new Set(Object.keys(NIVEIS).flatMap(k => (+k === NV ? S : store.get(NIVEIS[k].chave)).done.slice().sort((a, b) => a - b).flatMap(n => NIVEIS[k].lessons[n].ya_lee)))];
  const atual = Math.min(TOTAL, (S.done.length ? Math.max(...S.done) : 0) + 1), P = LS[atual].papas;
  const guia = P => `<h3>${P.titulo}</h3><p><b>Qué aprende.</b> ${P.hoy}</p><p><b>Cómo acompañar.</b> ${P.acompanar}</p><p><b>Fuera de la pantalla.</b> ${P.fuera}</p>`;
  const oferta = NIVEIS[2] ? "" : `<div class="oferta" id="oferta"><img src="img/nivel2.webp" alt=""><div class="of-in">
      <h3 class="of-t">${TXT.ofTitulo}</h3>${TXT.ofLinhas.map((l, i) => `<p>${i === 2 && !store.get(NIVEIS[1].chave).done.length ? TXT.ofLinha3SemJogo : l}</p>`).join("")}
      <div class="of-fig">${["sapo", "chuva", "bolo", "arvore", "estrela"].map(f => pic(f)).join("")}</div>
      <p class="of-preco">${TXT.ofPreco}</p><button class="cta of-cta" id="bOferta">${TXT.ofBotao}</button></div></div>`;
  const ult = lidas.slice(-12);
  $("papasBody").innerHTML = `<button class="close" data-close2>✕</button>
    <h2>Área de papás</h2>
    <p class="muted">${NIVEIS[2] ? "Nivel " + NV + " · " : ""}Lecciones terminadas: ${S.done.length} de ${TOTAL}</p>
    <div class="prog" style="margin:6px 0 2px"><i style="width:${S.done.length / TOTAL * 100}%"></i></div>
    ${S.done.includes(TOTAL) ? `<button class="cta" id="bCert2" style="margin-top:14px">Imprimir certificado</button>` : ""}
    <p class="muted" style="margin-top:16px">Guía de la próxima lección</p>${guia(P)}
    ${oferta}
    <h3>Su hijo ya puede leer</h3>
    ${lidas.length ? `<p class="lee-n"><b>${lidas.length}</b> palabras en inglés</p><div class="words">${ult.map(w => `<b>${w}</b>`).join("")}</div>
      ${lidas.length > ult.length ? `<details class="todas"><summary>Ver todas</summary><div class="words">${lidas.map(w => `<b>${w}</b>`).join("")}</div></details>` : ""}`
      : `<p class="muted">Aquí aparecerán las palabras que su hijo ya lee.</p>`}
    ${instalado() ? "" : `<h3>Instalar en el celular</h3><p>Así Tito queda en la pantalla de inicio y funciona sin internet.</p><button class="cta" id="bInst" style="font-size:18px;padding:14px 26px">Instalar la app</button><div id="pasosInstalar"></div>`}`;
  $("mPapas").classList.add("on");
  document.querySelector("[data-close2]").onclick = () => $("mPapas").classList.remove("on");
  if ($("bCert2")) $("bCert2").onclick = certificado;
  if ($("bInst")) $("bInst").onclick = instalar;
  if ($("bOferta")) $("bOferta").onclick = () => { if (!LINK_NIVEL2){ toast("El enlace de compra todavía no está activo"); return; } window.open(LINK_NIVEL2, "_blank"); };
  if (irOferta && $("oferta")) setTimeout(() => $("oferta").scrollIntoView({behavior: "smooth", block: "start"}), 200);
  irOferta = false;
}

/* ===== instalar no celular (o service worker vai cedo: sem ele o Android não oferece instalar) ===== */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("n2k3vzop/sw.js").catch(() => {});
let promptInstalar = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptInstalar = e; });
const instalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function instalar(){
  if (instalado()){ toast("La app ya está instalada en este celular"); return; }
  if (promptInstalar){ promptInstalar.prompt(); promptInstalar.userChoice.finally(() => promptInstalar = null); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const pasos = ios
    ? ["En Safari, toque el botón de tres rayitas (o tres puntitos) junto a la dirección.", "Toque «Compartir».", "Toque «Ver más» (el botón redondo con una flecha). Si no lo ve, deslice la lista hacia abajo.", "Toque «Agregar a pantalla de inicio».", "Toque «Agregar». ¡Listo! Tito aparece en su pantalla."]
    : ["En Chrome, toque los tres puntitos ⋮ arriba a la derecha.", "Elija «Instalar app» (no «Crear acceso directo»).", "Toque «Instalar». ¡Listo! Tito aparece en su pantalla."];
  const caja = $("pasosInstalar"); if (!caja) return;
  caja.innerHTML = `<ol>${pasos.map(x => `<li>${x}</li>`).join("")}</ol>`;
}

/* ===== menu do jogo ===== */
const INFO_NIVEL = {1: {thumb: "nivel1", sub: TXT.sub1}, 2: {thumb: "nivel2", sub: TXT.sub2}};
function renderMenu(){
  $("mNiveis").innerHTML = [1, 2].map(k => {
    const tem = !!NIVEIS[k], f = tem ? (k === NV ? S : store.get(NIVEIS[k].chave)).done.length : 0;
    return `<button class="ncard${tem ? "" : " lock"}${tem && k === NV ? " atual" : ""}" data-n="${k}">
      <span class="nthumb" style="background-image:url(img/${INFO_NIVEL[k].thumb}.webp)">${tem ? "" : `<img src="img/ui-cadeado.webp" alt=""><em>${TXT.novo}</em>`}</span>
      <b>Nivel ${k}</b><small>${tem ? INFO_NIVEL[k].sub : TXT.bloqueado}</small>
      ${tem ? `<span class="nprog"><i style="width:${f / TOTAL * 100}%"></i></span><span class="nstar"><img src="img/ui-estrela.webp" alt=""> ${f} / ${TOTAL}</span>` : ""}
    </button>`;
  }).join("");
  document.querySelectorAll(".ncard").forEach(b => b.onclick = () => {
    const k = +b.dataset.n;
    if (!NIVEIS[k]){ $("n2Tit").textContent = TXT.n2Tit; $("n2Txt").textContent = TXT.n2Txt; $("mN2").classList.add("on"); return; }
    setNivel(k); show("home"); renderTrail();
  });
  stopHint();  /* no menu o botão é óbvio: sem mãozinha (Vini, 19/10) */
}
$("bJugar").onclick = () => { show("home"); renderTrail(); };
$("bMenu").onclick = () => { show("menu"); renderMenu(); };
$("bAlbumMenu").onclick = () => $("bAlbum").click();
$("mPapas2").onclick = () => $("bPapas").click();
$("bN2Sair").onclick = () => $("mN2").classList.remove("on");
$("bN2Papas").onclick = () => { $("mN2").classList.remove("on"); irOferta = true; $("mGate").classList.add("on"); };
let oiK = 0;
const OI = ["Hi! I'm Tito!", "Let's read together!", "You can do it!"];
$("mTito").onclick = () => { const t = $("mTito"); t.classList.remove("pula"); void t.offsetWidth; t.classList.add("pula"); const k = oiK++ % 3; play("tito-oi-" + (k + 1), OI[k], 0.9); };

renderMenu();
</script>
