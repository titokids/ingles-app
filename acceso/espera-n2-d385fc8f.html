*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:600 17px/1.5 var(--ui)}
main{max-width:480px;margin:0 auto;padding:0 18px 40px}img{max-width:100%;height:auto;display:block}

.lista{list-style:none;padding:0;margin:6px 0 0}.lista li{position:relative;padding:6px 0 6px 30px}
.lista li:before{content:"✓";position:absolute;left:0;top:6px;width:21px;height:21px;border-radius:50%;background:var(--green);color:#fff;font:900 13px/21px var(--ui);text-align:center}
.precio{text-align:center;margin:18px 0 6px}.precio b{display:block;font:900 40px/1 var(--ui)}.precio span{font:800 14.5px/1.4 var(--ui);color:var(--ink-2)}
.btn{display:block;width:100%;border:0;border-radius:99px;padding:19px 22px;font:900 20px/1.15 var(--ui);color:#fff;background:var(--orange);box-shadow:0 6px 0 var(--orange-d),0 12px 22px rgba(217,128,44,.25);text-align:center;text-decoration:none;margin:14px 0 8px}
.btn.verde{background:var(--green);box-shadow:0 6px 0 var(--green-d),0 12px 22px rgba(44,138,84,.25)}

.no{display:block;text-align:center;margin:18px 0 6px;font:800 16px/1.4 var(--ui);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.fones{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}

.folhas{position:relative;height:300px;margin:8px auto 18px;max-width:360px}
.folhas img{position:absolute;width:62%;background:#fff;border-radius:6px;box-shadow:0 14px 28px rgba(61,51,85,.25)}
.folhas img:first-child{left:4%;top:10px;transform:rotate(-6deg)}.folhas img:last-child{right:4%;top:0;transform:rotate(5deg)}
.tito{width:120px;margin:16px auto 0}.passos{padding-left:22px;margin:6px 0}.passos li{margin:5px 0}
.pq{font-size:15px;color:var(--ink-2)}</style></head>
